name: Sync to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - 'titanic_model_dtc/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Hugging Face CLI
        run: pip install -U huggingface_hub

      - name: Upload app to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: hf upload scimldata/titanic-survivor-predictor titanic_model_dtc . --repo-type space --commit-message "Sync from GitHub"
